<svg xmlns="http://www.w3.org/2000/svg" viewBox="213 57 843 894" role="img" aria-label="Homistry"><style>
  * { animation: none !important; }
  #shadow, #sheet-bottom, #sheet-top, #walls, #walls-front, #h-left, #h-right, #h-bar, #h-glass, #glow, .hm-word { transform-box: fill-box; }
  @keyframes hm-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes hm-drop { from { opacity: 0; transform: translateY(-26px); } to { opacity: 1; transform: none; } }
  @keyframes hm-grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes hm-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes hm-glowpulse { 0% { opacity: 0; } 60% { opacity: 1; } 80% { opacity: 0.7; } 100% { opacity: 1; } }
  #shadow { animation: hm-fade 0.6s ease-out both; }
  #sheet-bottom { animation: hm-rise 0.7s cubic-bezier(.2,.8,.2,1) both; }
  #sheet-top { animation: hm-drop 0.7s cubic-bezier(.2,.8,.2,1) 0.3s both; }
  #walls, #walls-front { transform-origin: 50% 100%; animation: hm-grow 0.45s cubic-bezier(.6,0,.2,1) 0.8s both; }
  #h-left { transform-origin: 50% 100%; animation: hm-grow 0.8s cubic-bezier(.6,0,.2,1) 1.1s both; }
  #h-right { transform-origin: 50% 100%; animation: hm-grow 0.6s cubic-bezier(.6,0,.2,1) 1.4s both; }
  #h-bar { animation: hm-drop 0.55s cubic-bezier(.2,.8,.2,1) 1.9s both; }
  #h-glass { transform-origin: 50% 100%; animation: hm-grow 0.8s cubic-bezier(.6,0,.2,1) 2.3s both; }
  #glow { animation: hm-glowpulse 1s ease-out 3s both; }
  .hm-word { animation: hm-rise 0.7s cubic-bezier(.2,.8,.2,1) 3.2s both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
